<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111315" />
    <title>Discipline OS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Real-Life Execution Engine</p>
          <h1>Discipline OS</h1>
        </div>
        <div class="status-block">
          <span id="liveClock" class="clock-pill">--:--</span>
          <span id="todayLabel" class="date-label">Today</span>
        </div>
      </header>

      <main class="content">
        <section id="view-today" class="view active" aria-label="Today"></section>
        <section id="view-history" class="view" aria-label="History"></section>
        <section id="view-routines" class="view" aria-label="Routines"></section>
        <section id="view-settings" class="view" aria-label="Settings"></section>
      </main>

      <nav class="bottom-nav" aria-label="Primary">
        <button class="nav-item active" data-tab="today">Today</button>
        <button class="nav-item" data-tab="history">History</button>
        <button class="nav-item" data-tab="routines">Routines</button>
        <button class="nav-item" data-tab="settings">Settings</button>
      </nav>
    </div>

    <dialog id="taskDialog" class="dialog">
      <form id="taskForm" method="dialog" class="dialog-card">
        <div class="dialog-head">
          <div>
            <p class="eyebrow">Task Builder</p>
            <h2 id="taskDialogTitle">Add Task</h2>
          </div>
          <button type="button" class="icon-button" id="closeTaskDialog" aria-label="Close">x</button>
        </div>

        <input type="hidden" id="taskId" />

        <label>
          Step 1: Name
          <input id="taskName" type="text" placeholder="e.g. Morning Skincare" required />
        </label>

        <div class="form-grid">
          <label>
            Category
            <select id="taskCategory"></select>
          </label>
          <label>
            Step 2: Type
            <select id="taskType"></select>
          </label>
        </div>

        <div class="form-grid">
          <label>
            Target / required count
            <input id="taskTarget" type="number" min="0" step="0.1" placeholder="4 for water, 2 for doses" />
          </label>
          <label>
            Step 3: Time logic
            <select id="taskTimeLogic">
              <option value="flexible">Flexible task</option>
              <option value="window">Time-bound task</option>
            </select>
          </label>
        </div>

        <div class="form-grid">
          <label>
            Start time
            <input id="taskStartTime" type="time" />
          </label>
          <label>
            End time
            <input id="taskEndTime" type="time" />
          </label>
        </div>

        <div class="form-grid">
          <label>
            Reminder time(s)
            <input id="taskReminderTimes" type="text" placeholder="09:00, 13:00, 18:00" />
          </label>
          <label>
            Step 4: Frequency
            <select id="taskFrequency">
              <option value="daily">Daily</option>
              <option value="specific-days">Specific days</option>
              <option value="interval">Interval</option>
            </select>
          </label>
        </div>

        <div class="form-grid">
          <label>
            Specific days
            <input id="taskDays" type="text" placeholder="Mon, Tue, Wed" />
          </label>
          <label>
            Interval days
            <input id="taskIntervalDays" type="number" min="1" step="1" placeholder="Every X days" />
          </label>
        </div>

        <div class="form-grid">
          <label>
            Points weight
            <input id="taskPoints" type="number" min="0" step="1" placeholder="Auto" />
          </label>
          <label class="toggle-row">
            <span>Enable scoring</span>
            <input id="taskScored" type="checkbox" checked />
          </label>
        </div>

        <label>
          Notes
          <textarea id="taskNotes" rows="3" placeholder="Optional context"></textarea>
        </label>

        <div class="dialog-actions">
          <button type="button" class="secondary-button danger-button" id="deleteTaskButton">Delete</button>
          <div class="spacer"></div>
          <button type="button" class="secondary-button" id="cancelTaskDialog">Cancel</button>
          <button type="submit" class="primary-button">Save</button>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
